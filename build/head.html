<title>TCP vs UDP Reliability Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a lab bench. Slim sticky nav, one working surface per tab, protocol colors carry meaning everywhere (TCP = teal, UDP = orange). */
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --surface2:#E3E9F1; --ink:#142030; --muted:#566879; --line:#C9D2DE;
  --tcp:#0B6F8E; --udp:#C2570C; --ok:#1D8657; --bad:#C23B3B; --warn:#B7791F; --btn:#142030; --btn-ink:#FFFFFF;
  --tcp-soft:#D9EEF5; --udp-soft:#F9E5D6; --grid:#D5DCE6;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C131B; --surface:#131D28; --surface2:#1B2837; --ink:#E5ECF3; --muted:#8C9DAF; --line:#2A3B4D;
  --tcp:#45B7DB; --udp:#F59049; --ok:#3FBF86; --bad:#F26D6D; --warn:#E3A84B; --btn:#E5ECF3; --btn-ink:#0C131B;
  --tcp-soft:#12303C; --udp-soft:#3A2416; --grid:#233243; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C131B; --surface:#131D28; --surface2:#1B2837; --ink:#E5ECF3; --muted:#8C9DAF; --line:#2A3B4D;
  --tcp:#45B7DB; --udp:#F59049; --ok:#3FBF86; --bad:#F26D6D; --warn:#E3A84B; --btn:#E5ECF3; --btn-ink:#0C131B;
  --tcp-soft:#12303C; --udp-soft:#3A2416; --grid:#233243; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:clamp(22px,3.4vw,30px);font-weight:800}
h2{font-size:20px;font-weight:800}
h3{font-size:15px;font-weight:600;font-family:var(--f-body)}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tcp-c{color:var(--tcp)} .udp-c{color:var(--udp)} .ok-c{color:var(--ok)} .bad-c{color:var(--bad)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
header.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:20px 12px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand small{color:var(--muted);font-size:12.5px}
.vs{display:inline-flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:6px;border-bottom:1px solid var(--line);scrollbar-width:thin}
nav.tabs a{flex:none;padding:8px 14px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px;white-space:nowrap}
nav.tabs a:hover{color:var(--ink);background:var(--surface2)}
nav.tabs a[aria-current="page"]{background:var(--btn);color:var(--btn-ink)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--tcp);outline-offset:2px}
main{padding-top:20px;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel.flat{background:transparent;border-style:dashed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:860px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lede{max-width:70ch;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:500;border:1px solid var(--line);background:var(--surface2);white-space:nowrap}
.chip.tcp{background:var(--tcp-soft);border-color:transparent;color:var(--tcp)}
.chip.udp{background:var(--udp-soft);border-color:transparent;color:var(--udp)}
.chip.ok{color:var(--ok)} .chip.bad{color:var(--bad)} .chip.warn{color:var(--warn)}
button,.btn{font:inherit;font-weight:600;font-size:14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer}
button:hover{background:var(--surface2)}
button.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
button.primary:hover{opacity:.9;background:var(--btn)}
button:disabled{opacity:.5;cursor:wait}
button.pill{border-radius:99px;padding:6px 14px;font-weight:500}
button.pill[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
label.f span.v{color:var(--ink);font-family:var(--f-mono);font-size:12.5px}
label.f .lh{display:flex;justify-content:space-between;gap:8px}
input[type=range]{width:100%;accent-color:var(--tcp)}
input[type=number],input[type=text],select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
textarea{font-family:var(--f-mono);font-size:13px;resize:vertical}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{accent-color:var(--tcp);width:16px;height:16px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 16px}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:right;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
#k_table td:nth-child(2),#k_table th:nth-child(2){text-align:left}
pre.code{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;font:12.5px/1.55 var(--f-mono);tab-size:4}
.codehead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line);min-width:0}
.stat b{font-family:var(--f-mono);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.diagram{width:100%;height:auto;display:block;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.diagram text{font-family:var(--f-mono);font-size:9.5px;fill:var(--ink)}
.diagram .mu{fill:var(--muted)}
.logbox{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:6px 0;font:12px/1.5 var(--f-mono)}
.logbox div{padding:2px 10px;display:flex;gap:10px}
.logbox div.future{opacity:.28}
.logbox div b{color:var(--muted);font-weight:400;flex:none;width:52px;text-align:right}
.chartbox{position:relative;height:260px}
.chartbox.tall{height:300px}
.verdict{font-weight:600}
.hdr{display:grid;grid-template-columns:repeat(32,minmax(0,1fr));border:1px solid var(--line);border-radius:6px;overflow:hidden}
.hdr button{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;padding:10px 2px;background:var(--surface);font-weight:500;font-size:11.5px;line-height:1.2;min-height:44px;white-space:normal;overflow-wrap:anywhere}
.hdr button.rel{background:var(--tcp-soft)}
.hdr button.on{outline:2px solid var(--ink);outline-offset:-2px}
.hdr.udp button.rel{background:var(--udp-soft)}
.hdr button small{display:block;color:var(--muted);font-size:10px}
.bitscale{display:grid;grid-template-columns:repeat(32,minmax(0,1fr));font:9px var(--f-mono);color:var(--muted);margin-bottom:2px}
.callout{border-left:3px solid var(--tcp);padding:8px 14px;background:var(--surface2);border-radius:0 8px 8px 0;font-size:14px}
.callout.udp{border-color:var(--udp)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--btn);color:var(--btn-ink);font:600 12px/24px var(--f-mono);text-align:center}
details{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--surface)}
details summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
